<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HINOKI · Editor de carta</title>
<meta name="theme-color" content="#d4698a">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Shippori+Mincho+B1:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@page { size: A4; margin: 0; }
:root {
  --papel: #f9eceb; --papel-2: #f4dfe0; --rosa: #d4698a; --rosa-oscuro: #b04d6e; --rosa-claro: #f3b9c8; --rosa-palido: #fbe4ea;
  --tinta: #44303a; --gris: #866f77; --rama: #6c4a44; --linea: #e8c9d0;
  --titulo: 'Shippori Mincho B1', 'Hiragino Mincho ProN', Georgia, serif;
  --letra: 'Josefin Sans', 'Avenir Next', 'Helvetica Neue', Arial, sans-serif;
  --ui: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #efe3e4; color: var(--tinta); font-family: var(--ui); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

/* ---------- Barra y editor ---------- */
.barra { position: sticky; top: 0; z-index: 10; background: var(--tinta); color: #fff; padding: calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.barra h1 { font: 300 17px var(--letra); letter-spacing: .25em; margin: 0; flex: 1; min-width: 170px; }
.barra h1 small { display: block; font-size: 11px; letter-spacing: .08em; opacity: .7; font-family: var(--ui); }
.pestanas { display: inline-flex; background: rgba(255,255,255,.12); border-radius: 99px; padding: 3px; }
.pestanas button { border: 0; background: transparent; color: #fff; padding: 8px 14px; border-radius: 99px; font: 600 14px var(--ui); cursor: pointer; }
.pestanas button[aria-pressed="true"] { background: #fff; color: var(--tinta); }
.btn { border: 0; border-radius: 99px; padding: 10px 16px; font: 600 14px var(--ui); cursor: pointer; }
.btn.rosa { background: var(--rosa); color: #fff; }
.btn.claro { background: #fff; color: var(--tinta); border: 1px solid var(--linea); }
.btn.texto { background: transparent; color: var(--rosa-oscuro); padding: 8px 10px; }
.btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--rosa); outline-offset: 2px; }
.estado { font-size: 12px; opacity: .8; min-width: 80px; text-align: right; }

#editor { max-width: 860px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right)) 120px max(16px, env(safe-area-inset-left)); display: grid; gap: 14px; }
.tarjeta { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 2px 10px rgba(68,48,58,.06); }
.tarjeta h2 { font: 700 16px var(--ui); margin: 0 0 10px; }
.ayuda { font-size: 13px; color: var(--gris); margin: 0 0 12px; line-height: 1.45; }
.campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
label.campo { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--gris); }
input, textarea, select { font: 15px var(--ui); color: var(--tinta); border: 1px solid var(--linea); border-radius: 10px; padding: 9px 10px; background: #fff; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 58px; line-height: 1.4; }
details.pagina-ed { background: #fff; border-radius: 16px; box-shadow: 0 2px 10px rgba(68,48,58,.06); }
details.pagina-ed > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
details.pagina-ed > summary::-webkit-details-marker { display: none; }
details.pagina-ed > summary .jp { color: var(--rosa); font-family: var(--titulo); font-weight: 500; }
details.pagina-ed > summary .cuenta { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--gris); }
details.pagina-ed > summary::before { content: '▸'; color: var(--rosa); transition: transform .15s; }
details.pagina-ed[open] > summary::before { transform: rotate(90deg); }
.cuerpo-ed { padding: 0 16px 16px; display: grid; gap: 12px; }
.seccion-ed { border: 1px solid var(--linea); border-radius: 14px; padding: 12px; display: grid; gap: 10px; background: #fffafb; }
.cabeza-ed { display: flex; gap: 8px; align-items: end; }
.cabeza-ed label { flex: 1; }
.plato-ed { border-top: 1px dashed var(--linea); padding-top: 10px; display: grid; gap: 8px; }
.plato-ed .fila { display: grid; grid-template-columns: 1fr 140px; gap: 8px; }
@media (max-width: 520px) { .plato-ed .fila { grid-template-columns: 1fr; } }
.mover { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.mover button { border: 1px solid var(--linea); background: #fff; color: var(--tinta); border-radius: 8px; min-width: 36px; height: 34px; font-size: 15px; cursor: pointer; }
.mover button.borrar { color: #b3261e; }
.mover label.sig-ed { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--rosa-oscuro); margin-right: auto; }
.mover label.sig-ed input { width: 18px; height: 18px; }
.anadir { display: flex; gap: 8px; flex-wrap: wrap; }
.foto-ed { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.foto-ed img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 1px solid var(--linea); }
.foto-ed .sin { width: 64px; height: 64px; border-radius: 10px; border: 1px dashed var(--linea); display: grid; place-items: center; color: var(--gris); font-size: 22px; }

/* ---------- Vista previa ---------- */
#vista { padding: 16px 0 60px; }
#vista .hojas { width: 210mm; margin: 0 auto; }
.pagina { width: 210mm; height: 297mm; position: relative; overflow: hidden; margin: 0 auto 10mm; background: radial-gradient(120% 80% at 50% 0%, #fdf4f3 0%, var(--papel) 55%, var(--papel-2) 100%); font-family: var(--titulo); color: var(--tinta); box-shadow: 0 6px 24px rgba(68,48,58,.15); }
.deco { position: absolute; inset: 0; width: 210mm; height: 297mm; pointer-events: none; }
.petalos path { fill: url(#gPetalo); stroke: #e7a2b5; stroke-width: .6; }
.centro { fill: #c75479; } .estambre { stroke: #b84a6c; stroke-width: 1; } .antera { fill: #f4cf6a; }
.boton { fill: #e690ab; } .caliz { fill: none; stroke: #7a5148; stroke-width: 1.2; }
.rama { fill: none; stroke: var(--rama); stroke-width: 2.2; stroke-linecap: round; } .rama.fina { stroke-width: 1.3; }
.portada .sello { position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%); width: 118mm; height: 118mm; display: grid; place-items: center; align-content: center; text-align: center; }
.portada .aro { position: absolute; inset: 0; border: 1.4pt solid var(--rosa); border-radius: 50%; }
.portada .aro::after { content: ''; position: absolute; inset: 3.2mm; border: .5pt solid var(--rosa-claro); border-radius: 50%; }
.kanji-grande { font-family: var(--titulo); font-size: 40pt; color: var(--rosa); line-height: 1; margin-bottom: 4mm; }
.nombre-grande { font-family: var(--letra); font-weight: 300; font-size: 44pt; letter-spacing: .32em; padding-left: .32em; color: var(--rosa); line-height: 1; }
.lema { font-family: var(--letra); font-weight: 400; font-size: 9pt; letter-spacing: .28em; text-transform: uppercase; color: var(--rosa-oscuro); margin-top: 5mm; }
.pie-portada { position: absolute; left: 0; right: 0; bottom: 30mm; display: flex; justify-content: center; gap: 4mm; font-family: var(--letra); font-size: 10pt; letter-spacing: .4em; text-transform: uppercase; color: var(--rosa-oscuro); }
.pie-portada .punto { color: var(--rosa); }
.contenido { padding: 16mm 20mm 14mm; display: flex; flex-direction: column; }
.contenido header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: .6pt solid var(--linea); padding-bottom: 3mm; position: relative; }
.marca { display: flex; align-items: baseline; gap: 2.5mm; font-family: var(--letra); font-weight: 300; font-size: 15pt; letter-spacing: .3em; color: var(--rosa); }
.marca .kanji { font-family: var(--titulo); font-size: 14pt; letter-spacing: 0; }
.lugar { font-family: var(--letra); font-size: 8pt; letter-spacing: .22em; text-transform: uppercase; color: var(--gris); margin-right: 26mm; }
.cabeza { margin: 9mm 0 6mm; position: relative; }
.cabeza .jp { display: block; font-family: var(--titulo); font-size: 12pt; letter-spacing: .3em; color: var(--rosa); margin-bottom: 1.5mm; min-height: 1em; }
.cabeza h2 { font-family: var(--titulo); font-weight: 500; font-size: 30pt; margin: 0; color: var(--tinta); letter-spacing: .01em; }
.cabeza .sub { margin: 2mm 0 0; font-family: var(--letra); font-size: 10.5pt; letter-spacing: .04em; color: var(--gris); }
.cuerpo { flex: 1; position: relative; min-height: 0; overflow: hidden; }
.cuerpo.cols2 { column-count: 2; column-gap: 9mm; column-rule: .5pt solid var(--linea); }
.cuerpo section { margin-bottom: 5mm; }
.cuerpo section h3 { font-family: var(--letra); font-weight: 600; font-size: 10pt; letter-spacing: .26em; text-transform: uppercase; color: var(--rosa-oscuro); margin: 0 0 3.5mm; display: flex; align-items: center; gap: 3mm; }
.cuerpo section h3::after { content: ''; flex: 1; height: .5pt; background: var(--linea); }
.plato { margin-bottom: 4.5mm; break-inside: avoid; }
.cols2 .plato { margin-bottom: 4mm; }
.plato.con-foto { display: grid; grid-template-columns: 34mm 1fr; gap: 5mm; align-items: center; }
.cols2 .plato.con-foto { grid-template-columns: 24mm 1fr; gap: 3.5mm; }
.foto { display: block; width: 34mm; height: 34mm; object-fit: cover; border-radius: 3mm; border: .6pt solid var(--rosa-claro); box-shadow: 0 1mm 2.5mm rgba(68,48,58,.14); background: var(--rosa-palido); }
.cols2 .foto { width: 24mm; height: 24mm; border-radius: 2.4mm; }
.nombre { display: flex; flex-wrap: wrap; align-items: baseline; gap: 1.6mm 2.2mm; }
.nombre b { font-family: var(--titulo); font-weight: 700; font-size: 14pt; color: var(--tinta); }
.cols2 .nombre b { font-size: 12.5pt; }
.det { font-family: var(--letra); font-size: 9pt; letter-spacing: .06em; color: var(--gris); }
.sig { display: inline-flex; align-items: center; gap: 1mm; font-family: var(--letra); font-size: 7.5pt; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--rosa); background: var(--rosa-palido); border: .5pt solid var(--rosa-claro); border-radius: 10pt; padding: .4mm 2mm .3mm 1.2mm; }
.sig svg { width: 3.4mm; height: 3.4mm; overflow: visible; }
.plato p { margin: 1mm 0 0; font-family: var(--titulo); font-size: 11pt; line-height: 1.4; color: #4f3b44; }
.cols2 .plato p { font-size: 10pt; }
.nota { font-family: var(--letra); font-size: 9pt; letter-spacing: .04em; color: var(--gris); font-style: italic; margin: 1mm 0 4mm; }
.contenido footer { display: flex; justify-content: space-between; border-top: .6pt solid var(--linea); padding-top: 2.5mm; font-family: var(--letra); font-size: 8pt; letter-spacing: .24em; text-transform: uppercase; color: var(--gris); }

[hidden] { display: none !important; }
@media print {
  body { background: none; }
  .barra, #editor { display: none !important; }
  #vista { display: block !important; padding: 0; }
  #vista .hojas { zoom: 1 !important; }
  .pagina { margin: 0; box-shadow: none; break-after: page; page-break-after: always; }
}
</style>
</head>

  function ajustarZoom() {
    const ancho = 210 * 96 / 25.4;
    $('hojas').style.zoom = Math.min(1, (window.innerWidth - 24) / ancho);
  }

  // La foto se guarda dentro de la carta, pequeña: en la hoja mide 34 mm y así caben todas en el móvil.
  const LADO_FOTO = 480;
  async function fotoPequena(archivo) {
    const img = await createImageBitmap(archivo);
    const lado = Math.min(img.width, img.height);
    const c = document.createElement('canvas');
    c.width = c.height = Math.min(LADO_FOTO, lado);
    c.getContext('2d').drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.78);
  }

  // ---------- Editor ----------
  const campo = (etq, ruta, valor, tipo) => tipo === 'area'
    ? '<label class="campo">' + etq + '<textarea data-ruta="' + ruta + '">' + esc(valor) + '</textarea></label>'
    : '<label class="campo">' + etq + '<input data-ruta="' + ruta + '" value="' + esc(valor) + '"></label>';
  const mover = (tipo, ruta, extra) => '<div class="mover">' + (extra || '') +
    '<button type="button" data-accion="subir" data-tipo="' + tipo + '" data-ruta="' + ruta + '" aria-label="Subir">↑</button>' +
    '<button type="button" data-accion="bajar" data-tipo="' + tipo + '" data-ruta="' + ruta + '" aria-label="Bajar">↓</button>' +
    '<button type="button" class="borrar" data-accion="borrar" data-tipo="' + tipo + '" data-ruta="' + ruta + '" aria-label="Borrar">✕</button></div>';

  let abiertas = new Set([0]);
  function pintarEditor() {
    const r = carta.restaurante;
    const hojas = pintarCarta();
    let h = '<div class="tarjeta"><h2>La carta</h2><p class="ayuda">Cambia lo que quieras: se guarda solo en este dispositivo. Toca «Ver carta» para verla como quedará y «Guardar PDF» para imprimirla o mandarla.</p>' +
      '<div class="campos">' + campo('Nombre', 'restaurante.nombre', r.nombre) + campo('Kanji', 'restaurante.kanji', r.kanji) + campo('Lema', 'restaurante.lema', r.lema) + campo('Ciudad', 'restaurante.ciudad', r.ciudad) + '</div></div>';
    h = h.replace('</p><div class="campos">', ' La carta ocupa ' + (hojas + 1) + ' hojas con la portada: si una página no cabe, sigue sola en la siguiente.</p><div class="campos">');
    carta.paginas.forEach((pg, i) => {
      const n = pg.secciones.reduce((t, s) => t + s.platos.length, 0);
      h += '<details class="pagina-ed" data-i="' + i + '"' + (abiertas.has(i) ? ' open' : '') + '><summary><span class="jp">' + esc(pg.jp) + '</span>' + esc(pg.titulo || 'Página sin título') + '<span class="cuenta">' + n + (n === 1 ? ' plato' : ' platos') + '</span></summary><div class="cuerpo-ed">' +
        '<div class="campos">' + campo('Título', 'paginas.' + i + '.titulo', pg.titulo) + campo('Japonés (opcional)', 'paginas.' + i + '.jp', pg.jp) +
        '<label class="campo">Columnas<select data-ruta="paginas.' + i + '.cols"><option value="1"' + (pg.cols !== 2 ? ' selected' : '') + '>1 columna</option><option value="2"' + (pg.cols === 2 ? ' selected' : '') + '>2 columnas</option></select></label></div>' +
        campo('Subtítulo', 'paginas.' + i + '.sub', pg.sub) + campo('Nota al pie (opcional)', 'paginas.' + i + '.nota', pg.nota);
      pg.secciones.forEach((s, j) => {
        h += '<div class="seccion-ed"><div class="cabeza-ed">' + campo('Sección', 'paginas.' + i + '.secciones.' + j + '.titulo', s.titulo) + mover('seccion', i + '.' + j) + '</div>';
        s.platos.forEach((p, k) => {
          const base = 'paginas.' + i + '.secciones.' + j + '.platos.' + k;
          h += '<div class="plato-ed"><div class="fila">' + campo('Plato', base + '.nombre', p.nombre) + campo('Detalle', base + '.detalle', p.detalle) + '</div>' +
            campo('Descripción', base + '.descripcion', p.descripcion, 'area') +
            '<div class="foto-ed">' + (p.foto ? '<img src="' + esc(p.foto) + '" alt="Foto de ' + esc(p.nombre) + '">' : '<span class="sin" aria-hidden="true">📷</span>') +
            '<button type="button" class="btn claro" data-accion="foto" data-ruta="' + i + '.' + j + '.' + k + '">' + (esMuestra(p.foto) ? 'Poner la foto real' : p.foto ? 'Cambiar foto' : 'Poner foto del plato') + '</button>' +
            (p.foto ? '<button type="button" class="btn texto" data-accion="quitarFoto" data-ruta="' + i + '.' + j + '.' + k + '">Quitar foto</button>' : '') + '</div>' +
            mover('plato', i + '.' + j + '.' + k, '<label class="sig-ed"><input type="checkbox" data-ruta="' + base + '.signature"' + (p.signature ? ' checked' : '') + '> Signature</label>') + '</div>';
        });
        h += '<div class="anadir"><button type="button" class="btn claro" data-accion="nuevoPlato" data-ruta="' + i + '.' + j + '">+ Plato</button></div></div>';
      });
      h += '<div class="anadir"><button type="button" class="btn claro" data-accion="nuevaSeccion" data-ruta="' + i + '">+ Sección</button>' + mover('pagina', String(i)) + '</div></div></details>';
    });
    h += '<div class="anadir"><button type="button" class="btn claro" data-accion="nuevaPagina">+ Página</button></div>' +
      '<div class="tarjeta"><h2>Copias</h2><p class="ayuda">Guarda una copia de la carta en un archivo, o recupera una. Útil para pasarla a otro dispositivo.</p>' +
      '<div class="anadir"><button type="button" class="btn claro" data-accion="exportar">Descargar copia</button><button type="button" class="btn claro" data-accion="importar">Recuperar copia</button>' +
      '<button type="button" class="btn texto" data-accion="original">Volver a la carta original</button></div></div>';
    $('editor').innerHTML = h;
  }

  function poner(ruta, valor) {
    const partes = ruta.split('.');
    let o = carta;
    partes.slice(0, -1).forEach((p) => { o = o[p]; });
    o[partes[partes.length - 1]] = valor;
  }
  $('editor').addEventListener('input', (e) => {
    const el = e.target;
    if (!el.dataset.ruta) return;
    const v = el.type === 'checkbox' ? el.checked : el.dataset.ruta.endsWith('.cols') ? Number(el.value) : el.value;
    poner(el.dataset.ruta, v);
    guardar();
    if (el.tagName === 'SELECT' || el.type === 'checkbox') pintarEditor();
  });
  $('editor').addEventListener('toggle', (e) => {
    const d = e.target.closest && e.target.closest('details.pagina-ed');
    if (!d) return;
    const i = Number(d.dataset.i);
    if (d.open) abiertas.add(i); else abiertas.delete(i);
  }, true);
  // Al salir de un campo de texto se revisa si alguna página se ha quedado sin sitio.
  $('editor').addEventListener('change', (e) => { if (e.target.dataset.ruta && e.target.tagName !== 'SELECT' && e.target.type !== 'checkbox') pintarEditor(); });

  function lista(tipo, ruta) {
    const n = ruta.split('.').map(Number);
    if (tipo === 'pagina') return [carta.paginas, n[0]];
    if (tipo === 'seccion') return [carta.paginas[n[0]].secciones, n[1]];
    return [carta.paginas[n[0]].secciones[n[1]].platos, n[2]];
  }
  $('editor').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-accion]');
    if (!b) return;
    const a = b.dataset.accion, ruta = b.dataset.ruta || '';
    if (a === 'subir' || a === 'bajar' || a === 'borrar') {
      const [arr, k] = lista(b.dataset.tipo, ruta);
      if (a === 'borrar') {
        const que = b.dataset.tipo === 'plato' ? '«' + (arr[k].nombre || 'este plato') + '»' : b.dataset.tipo === 'seccion' ? 'la sección «' + arr[k].titulo + '» con sus platos' : 'la página «' + arr[k].titulo + '» con todo lo que tiene';
        if (!confirm('¿Borrar ' + que + '?')) return;
        arr.splice(k, 1);
      } else {
        const d = a === 'subir' ? -1 : 1;
        if (k + d < 0 || k + d >= arr.length) return;
        [arr[k], arr[k + d]] = [arr[k + d], arr[k]];
      }
    } else if (a === 'foto') {
      const [arr, k] = lista('plato', ruta);
      const entrada = document.createElement('input');
      entrada.type = 'file'; entrada.accept = 'image/*';
      entrada.onchange = async () => {
        try { arr[k].foto = await fotoPequena(entrada.files[0]); guardar(); pintarEditor(); }
        catch (err) { alert('No se pudo usar esa foto.'); }
      };
      entrada.click();
      return;
    } else if (a === 'quitarFoto') {
      const [arr, k] = lista('plato', ruta);
      arr[k].foto = '';
    } else if (a === 'nuevoPlato') {
      const [i, j] = ruta.split('.').map(Number);
      carta.paginas[i].secciones[j].platos.push({ nombre: 'Plato nuevo', detalle: '', signature: false, descripcion: '' });
    } else if (a === 'nuevaSeccion') {
      carta.paginas[Number(ruta)].secciones.push({ titulo: 'Sección nueva', platos: [] });
    } else if (a === 'nuevaPagina') {
      carta.paginas.push({ jp: '', titulo: 'Página nueva', sub: '', cols: 1, nota: '', secciones: [{ titulo: 'Sección nueva', platos: [] }] });
      abiertas.add(carta.paginas.length - 1);
    } else if (a === 'exportar') {
      const blob = new Blob([JSON.stringify(carta, null, 1)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const enlace = document.createElement('a');
      enlace.href = url; enlace.download = 'carta-' + (carta.restaurante.nombre || 'restaurante').toLowerCase() + '.json';
      document.body.appendChild(enlace); enlace.click(); enlace.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      return;
    } else if (a === 'importar') {
      const entrada = document.createElement('input');
      entrada.type = 'file'; entrada.accept = 'application/json,.json';
      entrada.onchange = async () => {
        try {
          const c = JSON.parse(await entrada.files[0].text());
          if (!c || !c.restaurante || !Array.isArray(c.paginas)) throw new Error();
          if (!confirm('¿Cambiar la carta actual por la de la copia?')) return;
          carta = ponerMuestras(c); guardar(); pintarEditor();
        } catch (err) { alert('Ese archivo no es una copia de la carta.'); }
      };
      entrada.click();
      return;
    } else if (a === 'original') {
      if (!confirm('¿Volver a la carta original? Se pierden los cambios que no estén en una copia.')) return;
      carta = ponerMuestras(copiar(ORIGINAL));
    }
    guardar();
    pintarEditor();
  });

  // ---------- Modos y PDF ----------
  let modo = 'editar';
  function ponerModo(m) {
    modo = m;
    $('verEditar').setAttribute('aria-pressed', m === 'editar');
    $('verVista').setAttribute('aria-pressed', m === 'vista');
    $('editor').hidden = m !== 'editar';
    $('vista').hidden = m !== 'vista';
    if (m === 'vista') pintarCarta();
    window.scrollTo(0, 0);
  }
  $('verEditar').addEventListener('click', () => ponerModo('editar'));
  $('verVista').addEventListener('click', () => ponerModo('vista'));
  $('pdf').addEventListener('click', () => {
    pintarCarta();
    const anterior = document.title;
    document.title = (carta.restaurante.nombre || 'Carta') + ' - Carta';
    const volver = () => { document.title = anterior; $('vista').hidden = modo !== 'vista'; };
    $('vista').hidden = false;
    window.addEventListener('afterprint', volver, { once: true });
    // Las fotos de muestra llegan por internet: se espera a que estén antes de imprimir.
    const fotos = [...document.querySelectorAll('#hojas img')].map((im) => im.complete ? null : new Promise((ok) => { im.onload = im.onerror = ok; })).filter(Boolean);
    Promise.race([Promise.all(fotos), new Promise((ok) => setTimeout(ok, 15000))]).then(() => setTimeout(() => window.print(), 50));
  });
  window.addEventListener('resize', ajustarZoom);

  pintarEditor();
  ponerModo('editar');
  if (document.fonts) document.fonts.ready.then(() => { if (!$('editor').hidden) pintarEditor(); });
})();
</script>
</body>
</html>
